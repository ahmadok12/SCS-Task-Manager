name: Deploy Cloudflare attachment worker

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: cloudflare-attachment-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Deploy Worker and R2 binding
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          wranglerVersion: "4.32.0"
          command: deploy --keep-vars

      - name: Verify live health endpoint
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors \
            https://scs-task-attachments.ezychinadirect.workers.dev/health

      - name: Publish deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_RESULT: ${{ job.status }}
        run: |
          if [ "$DEPLOYMENT_RESULT" = "success" ]; then
            state="success"
            description="Cloudflare Worker deployed and health check passed"
          else
            state="failure"
            description="Cloudflare Worker deployment or health check failed"
          fi

          payload=$(jq -nc \
            --arg state "$state" \
            --arg description "$description" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state: $state, context: "cloudflare-worker/deployment", description: $description, target_url: $target_url}')

          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload"
